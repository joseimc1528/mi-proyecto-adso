info:
  name: " Inyección SQL en email"
  type: http

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/by-email?email='OR'1'='1'--@x.co"
  params:
    - name: email
      value: "'OR'1'='1'--@x.co"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
