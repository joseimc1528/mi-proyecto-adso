info:
  name: 03 · Inyección NoSQL en tipo
  type: http

http:
  method: GET
  url: "{{baseUrl}}/api/content/published?type[$ne]=banner"
  params:
    - name: type[$ne]
      value: banner
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
